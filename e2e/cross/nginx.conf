# The IAM's TLS terminator (the load balancer in production): TLS on
# 127.0.0.1:27643, the client certificate (when one is presented)
# forwarded to the IAM, which trusts it from this address only
# (HTTP_CLIENT_CERT_PROXY_CIDRS) and binds ACS tokens to it (RFC 8705).
# ACS fetches the IAM's key sets here; MailOS asks for its ACS tokens here.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  access_log off;
  server {
    listen 127.0.0.1:27643 ssl;
    ssl_certificate     /etc/iam-tls/iam-tls.crt;
    ssl_certificate_key /etc/iam-tls/iam-tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Requested, not verified here: the IAM matches it to the client.
    ssl_verify_client optional_no_ca;
    location / {
      proxy_pass http://127.0.0.1:27680;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
    }
  }
}
