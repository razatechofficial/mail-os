# Assertions for MailOS's ACS module (contract C4, plan 1.9). ACS runs them
# against the composed schema (core + every module) on each module change;
# its schemaFile is not read. To run them by hand, compose the core and the
# module into one file and point zed at it:
#   { echo 'use expiration'; cat <ACS>/schema/core/<root>.zed; grep -v '^use ' module.zed; } > /tmp/c.zed
#   zed validate validation.yaml --schema-file /tmp/c.zed   (or set schemaFile)
#
# Each role is held by its own user (an activation expiring far ahead):
# the full matrix below is the table of contract C4. The rule "no role
# reaches content, keys and logs together" (CCM IAM-09) follows from it and
# is spelled out per role: content = view/edit/publish_templates, keys =
# manage_keys, logs = view/verify/export_audit. Eligibility alone and an
# expired activation reach nothing.
relationships: |-
  mailos/platform:global#eligible_platform_owner@user:owner
  mailos/platform:global#platform_owner@user:owner[expiration:2999-01-01T00:00:00Z]
  mailos/platform:global#eligible_platform_owner@user:eligible_only
  mailos/platform:global#platform_owner@user:expired[expiration:2001-01-01T00:00:00Z]
  mailos/platform:global#eligible_platform_operator@user:operator
  mailos/platform:global#platform_operator@user:operator[expiration:2999-01-01T00:00:00Z]
  mailos/platform:global#eligible_platform_operator@user:eligible_only
  mailos/platform:global#platform_operator@user:expired[expiration:2001-01-01T00:00:00Z]
  mailos/platform:global#eligible_platform_template_editor@user:template_editor
  mailos/platform:global#platform_template_editor@user:template_editor[expiration:2999-01-01T00:00:00Z]
  mailos/platform:global#eligible_platform_template_editor@user:eligible_only
  mailos/platform:global#platform_template_editor@user:expired[expiration:2001-01-01T00:00:00Z]
  mailos/platform:global#eligible_platform_template_publisher@user:template_publisher
  mailos/platform:global#platform_template_publisher@user:template_publisher[expiration:2999-01-01T00:00:00Z]
  mailos/platform:global#eligible_platform_template_publisher@user:eligible_only
  mailos/platform:global#platform_template_publisher@user:expired[expiration:2001-01-01T00:00:00Z]
  mailos/platform:global#eligible_platform_key_custodian@user:key_custodian
  mailos/platform:global#platform_key_custodian@user:key_custodian[expiration:2999-01-01T00:00:00Z]
  mailos/platform:global#eligible_platform_key_custodian@user:eligible_only
  mailos/platform:global#platform_key_custodian@user:expired[expiration:2001-01-01T00:00:00Z]
  mailos/platform:global#eligible_platform_abuse_analyst@user:abuse_analyst
  mailos/platform:global#platform_abuse_analyst@user:abuse_analyst[expiration:2999-01-01T00:00:00Z]
  mailos/platform:global#eligible_platform_abuse_analyst@user:eligible_only
  mailos/platform:global#platform_abuse_analyst@user:expired[expiration:2001-01-01T00:00:00Z]
  mailos/platform:global#eligible_platform_support@user:support
  mailos/platform:global#platform_support@user:support[expiration:2999-01-01T00:00:00Z]
  mailos/platform:global#eligible_platform_support@user:eligible_only
  mailos/platform:global#platform_support@user:expired[expiration:2001-01-01T00:00:00Z]
  mailos/platform:global#eligible_platform_log_admin@user:log_admin
  mailos/platform:global#platform_log_admin@user:log_admin[expiration:2999-01-01T00:00:00Z]
  mailos/platform:global#eligible_platform_log_admin@user:eligible_only
  mailos/platform:global#platform_log_admin@user:expired[expiration:2001-01-01T00:00:00Z]
