# Nothing reaches a MailOS pod and no MailOS pod reaches anything unless a
# later policy allows it. Policies are additive: each allow below names one
# peer and one port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailos-default-deny
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
