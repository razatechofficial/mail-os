# Postgres (server, worker, migration Job) and Redis (server, worker).
#
# The data stores run outside this namespace (recommended: their own
# namespace, mailos-data), so the namespace-wide default deny here never
# touches operator-managed pods. That namespace must admit the same traffic
# (docs/network-policy.md). ADJUST the selectors; for a managed database
# replace each `to` with an ipBlock of the endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailos-egress-postgres
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [mailos]
      - key: app.kubernetes.io/component
        operator: In
        values: [server, worker, migrate]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mailos-data
          podSelector:
            matchLabels:
              cnpg.io/cluster: mailos-pg
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailos-egress-redis
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [mailos]
      - key: app.kubernetes.io/component
        operator: In
        values: [server, worker]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mailos-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mailos-redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379 # Sentinel, when Redis runs with Sentinel
