# Prometheus scrapes the metrics listener (METRICS_ADDR, :9102) of the server
# and the worker, from the monitoring namespace only. The metrics port is
# never in the API rule above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailos-ingress-metrics
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [mailos]
      - key: app.kubernetes.io/component
        operator: In
        values: [server, worker]
  policyTypes:
    - Ingress
  ingress:
    - from:
        # gitops infrastructure/observability. ADJUST if Prometheus moves.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9102
