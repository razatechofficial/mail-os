syntax = "proto3";

package mailos.v1;

option go_package = "github.com/razatechofficial/mail-os/api/proto/v1;v1";

service TemplateService {
  rpc CreateTemplate(CreateTemplateRequest) returns (Template);
  rpc GetTemplate(GetTemplateRequest) returns (Template);
  rpc UpdateTemplate(UpdateTemplateRequest) returns (Template);
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc CreateVersion(CreateVersionRequest) returns (TemplateVersion);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
}

message CreateTemplateRequest {
  string name = 1;
  string slug = 2;
  string category = 3;
  string description = 4;
}

message GetTemplateRequest {
  string id = 1;
}

message UpdateTemplateRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  bool is_active = 4;
}

message DeleteTemplateRequest {
  string id = 1;
}

message DeleteTemplateResponse {}

message ListTemplatesRequest {
  Pagination pagination = 1;
}

message ListTemplatesResponse {
  repeated Template templates = 1;
  PaginationMeta meta = 2;
}

message CreateVersionRequest {
  string template_id = 1;
  string subject = 2;
  string html_body = 3;
  string text_body = 4;
  repeated string variables = 5;
}

message ListVersionsRequest {
  string template_id = 1;
}

message ListVersionsResponse {
  repeated TemplateVersion versions = 1;
}

message Template {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string slug = 4;
  string category = 5;
  string description = 6;
  bool is_active = 7;
  string created_at = 8;
  string updated_at = 9;
}

message TemplateVersion {
  string id = 1;
  string template_id = 2;
  int32 version = 3;
  string subject = 4;
  string html_body = 5;
  string text_body = 6;
  repeated string variables = 7;
  bool is_active = 8;
  string created_at = 9;
}
