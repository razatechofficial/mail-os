syntax = "proto3";

package mailos.v1;

option go_package = "github.com/razatechofficial/mail-os/api/proto/v1;v1";

message Pagination {
  int32 page = 1;
  int32 limit = 2;
  string sort_by = 3;
  string sort_order = 4;
}

message PaginationMeta {
  int32 page = 1;
  int32 limit = 2;
  int32 total_items = 3;
  int32 total_pages = 4;
}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}
