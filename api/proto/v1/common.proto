syntax = "proto3";

package mailos.v1;

option go_package = "github.com/razatechofficial/mail-os/api/proto/v1;v1";

message Pagination {
  int32 page = 1;
  int32 limit = 2;
  string sort_by = 3;
  string sort_order = 4;
}

message PaginationMeta {
  int32 page = 1;
  int32 limit = 2;
  int32 total_items = 3;
  int32 total_pages = 4;
}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

// Attachment is a file a message carries: an attachment, or an inline part
// the HTML body shows by its Content-ID (<img src="cid:logo">). The same
// limits, blocked types and virus scan apply as on the HTTP send API and
// the SMTP relay (ATTACHMENTS_*).
message Attachment {
  string filename = 1;
  // content_type is filled from the file name's extension when empty.
  string content_type = 2;
  bytes content = 3;
  // content_id names an inline part, without angle brackets.
  string content_id = 4;
  bool inline = 5;
}

// AttachmentInfo describes a stored file, never its content.
message AttachmentInfo {
  string filename = 1;
  string content_type = 2;
  int64 size = 3;
  string content_id = 4;
  bool inline = 5;
}
