# Local development. Secrets come from .env (see .env.example), never from
# this file. Plaintext listeners are allowed only because APP_ENV is local.
app:
  env: local
  log_level: debug
  log_format: console

http:
  host: 127.0.0.1
  port: 8080

grpc:
  host: 127.0.0.1
  port: 9090

cors:
  origins: ["http://localhost:3000"]

postgres:
  host: localhost
  port: 5432
  database: mail_os
  ssl_mode: disable

redis:
  host: localhost
  port: 6379

iam:
  issuer: http://localhost:8081
  audience: mailos

rate_limit:
  enabled: true
