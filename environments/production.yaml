# Production defaults. Everything secret or deployment-specific (issuer,
# hosts, certificates, KEY_MANAGER_MASTER_KEY, IAM_SERVICE_CLIENT_ID and
# IAM_SERVICE_TENANT_ID)
# comes from the environment (Vault through External Secrets).
app:
  env: production
  log_level: info
  log_format: json

http:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 60s
  idle_timeout: 120s

grpc:
  host: 0.0.0.0
  port: 9090

postgres:
  ssl_mode: verify-full
  max_conns: 50
  min_conns: 5

redis:
  tls: true

iam:
  audience: mailos

retention:
  message_days: 30

audit:
  retention_days: 365

rate_limit:
  enabled: true
