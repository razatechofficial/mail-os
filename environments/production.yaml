app:
  env: production
  log_level: info

http:
  host: 0.0.0.0
  port: ${HTTP_PORT}
  read_timeout: 10s
  write_timeout: 5m
  idle_timeout: 120s
  batch_send_concurrency: 50

grpc:
  host: 0.0.0.0
  port: ${GRPC_PORT}

postgres:
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  database: ${POSTGRES_DB}
  ssl_mode: require
  max_conns: 50
  min_conns: 10

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}
  db: 0

queue:
  backend: ${QUEUE_BACKEND}

encryption:
  key: ${ENCRYPTION_KEY}
  hmac_secret: ${HMAC_SECRET}

rate_limit:
  per_org: 1000
  burst: 100

worker:
  email_concurrency: 50
  campaign_concurrency: 20
  stats_flush_interval: 10s
  scheduler_interval: 30s
